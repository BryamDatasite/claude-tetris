<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">TEMA</span>
          <label class="theme-switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="name-entry" class="name-entry hidden">
          <p class="name-entry-label">¡Nuevo récord! Ingresa tu nombre:</p>
          <input id="name-input" type="text" maxlength="10" value="Jugador" />
          <button id="name-submit">Guardar</button>
        </div>
        <div id="overlay-records" class="records hidden">
          <div class="records-stats">
            <span>Mejor combo: <span id="overlay-best-combo">0</span></span>
            <span>Máx. líneas: <span id="overlay-max-lines">0</span></span>
          </div>
          <ol id="overlay-records-list" class="records-list"></ol>
        </div>
        <button id="restart-btn">Reiniciar</button>
        <button id="reset-scores-overlay" class="reset-btn hidden">Resetear récords</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div class="records">
          <div class="records-stats">
            <span>Mejor combo: <span id="start-best-combo">0</span></span>
            <span>Máx. líneas: <span id="start-max-lines">0</span></span>
          </div>
          <ol id="start-records-list" class="records-list"></ol>
        </div>
        <button id="play-btn">Jugar</button>
        <button id="reset-scores-start" class="reset-btn">Resetear récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
